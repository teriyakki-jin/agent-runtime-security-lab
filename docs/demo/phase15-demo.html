<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#143d62,#06111f 48%);color:#f5f8ff;font-family:Segoe UI,Arial,sans-serif}main{width:1280px;height:720px;padding:58px 68px;position:relative}.eyebrow{color:#2ce5e5;font-weight:800;letter-spacing:2px;font-size:14px}h1{font-size:45px;margin:18px 0 12px}p{font-size:20px;color:#98bddb;line-height:1.6;max-width:970px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:35px}.card{border:1px solid #24506f;background:#0c2035;border-radius:16px;padding:22px;min-height:190px}.card b{color:#42f3a4;font-size:24px}.card h2{font-size:21px}.card p{font-size:15px;margin:0}.status{position:absolute;right:68px;top:52px;border:1px solid #158d61;border-radius:25px;padding:10px 17px;color:#42f3a4;font-weight:800}.footer{position:absolute;left:68px;right:68px;bottom:42px;display:flex;justify-content:space-between;color:#78a8cc;font-size:13px}.accent{color:#42f3a4}.amber{color:#ffc857}
</style></head><body><main><div class="status">● LOCAL ISOLATED LAB</div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="lead"></p><div class="cards" id="cards"></div><div class="footer"><span>AGENT RUNTIME SECURITY LAB · PHASE 15</span><span id="page"></span></div></main><script>
const scenes=[
{e:'00:00 · THREAT MODEL',t:'AI Agent 공격을 실행 경계에서 추적한다',l:'프롬프트만 검사하지 않고 공급망, 도구 권한, 런타임 행동과 대응 증거를 하나의 흐름으로 연결합니다.',c:[['01','Prevent','변조된 MCP artifact와 오염된 prompt 차단'],['02','Detect','허용 intent와 실제 runtime 행동 비교'],['03','Respond','token 폐기·격리·복구·감사']]},
{e:'00:20 · BEFORE EXECUTION',t:'신뢰할 수 있는 코드와 최소 권한만 입장',l:'GitHub OIDC identity와 Rekor inclusion을 검증하고, signed manifest의 실제 tools/list와 digest가 맞아야 실행됩니다.',c:[['KEYLESS','Supply chain','Cosign · Rekor · digest-only launch'],['SBOM','Content policy','Critical/High 0 · license allowlist'],['OAUTH','Least privilege','Audience · scope · delegation chain']]},
{e:'00:40 · ATTACK REPLAY',t:'정상 6건과 공격 6건을 같은 경로로 실행',l:'간접 프롬프트 인젝션, shell tool misuse, 정책 거부 후 process 실행과 승인 전 network activity를 격리된 fixture로 재현합니다.',c:[['6','Normal fixtures','허용 문서와 일치하는 runtime'],['6','Attack fixtures','prompt · tool · process · network'],['0','External targets','실제 공격과 credential 원문 없음']]},
{e:'01:00 · CAUSAL DETECTION',t:'시간이 아닌 명시적 인과관계로 탐지',l:'OPA 결정, agent identity, MCP tool call, Tetragon observation을 parent edge와 동일 resource로 연결해 잘못된 시간 기반 상관분석을 거부합니다.',c:[['OPA','Policy boundary','allow · review · deny'],['eBPF','Runtime truth','process · file · network'],['GRAPH','Causal path','agent + resource + explicit parent']]},
{e:'01:20 · SAFE RESPONSE',t:'탈취 token을 폐기하고 MCP를 가역적으로 격리',l:'Critical causal finding에서만 응답하고, 동일 이벤트의 반복 대응을 억제합니다. 대상은 관리 label, Compose project, 고정 container ID로 제한됩니다.',c:[['REVOKE','OAuth jti','하위 delegation까지 즉시 inactive'],['ISOLATE','Docker target','network detach 후 container pause'],['DEDUP','Response key','동일 incident 재실행 방지']]},
{e:'01:40 · RECOVERY & EVIDENCE',t:'격리는 복구하고 폐기된 token은 되살리지 않는다',l:'TTL 또는 승인된 reviewer override로 container와 network를 복구합니다. OCSF와 Elastic에는 fingerprint와 감사 정보만 남깁니다.',c:[['TTL','Automatic recovery','영구 격리 방지'],['HUMAN','Override','hold · extend · restore'],['OCSF','Audit trail','secret과 raw arguments 제외']]},
{e:'02:00 · MEASURED RESULT',t:'Release Gate Passed',l:'고정된 성공 화면이 아니라 원시 샘플에서 p50/p95/p99, MTTR, resource, recall과 FPR을 계산하고 teardown 이후에만 최종 evidence를 확정합니다.',c:[['21.211 ms','Policy p95','p99 27.964 ms'],['2.9 s','Detect-to-block','목표 5초 이내'],['100% / 0%','Recall / FPR','containers · networks · volumes = 0']]}
];const n=Math.max(1,Math.min(7,Number(new URLSearchParams(location.search).get('scene')||1))),s=scenes[n-1];document.getElementById('eyebrow').textContent=s.e;document.getElementById('title').textContent=s.t;document.getElementById('lead').textContent=s.l;document.getElementById('cards').innerHTML=s.c.map(x=>`<article class="card"><b>${x[0]}</b><h2>${x[1]}</h2><p>${x[2]}</p></article>`).join('');document.getElementById('page').textContent=`${String(n).padStart(2,'0')} / 07`;
</script></body></html>
