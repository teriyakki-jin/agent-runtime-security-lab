  <text x="1462" y="598" text-anchor="middle" class="label" fill="#db3a4a" font-size="11">artifact denied</text>

  <!-- POST-EXECUTION -->
  <rect x="52" y="878" width="1696" height="310" rx="24" class="band"/>
  <rect x="76" y="898" width="354" height="34" rx="17" fill="url(#purpleGradient)"/>
