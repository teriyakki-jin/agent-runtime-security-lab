  <path d="M1528 266 H1562" class="flow-blue"/>
  <path d="M656 292 V448 H1538 Q1562 448 1562 370" class="flow-blue"/>
  <text x="1037" y="438" text-anchor="middle" class="label muted" font-size="11">allow or signed approval</text>

  <!-- RUNTIME -->
  <rect x="52" y="550" width="1696" height="302" rx="24" class="band"/>
  <rect x="76" y="570" width="378" height="34" rx="17" fill="url(#tealGradient)"/>
  <text x="99" y="593" class="label white" font-size="14" font-weight="600">02 · RUNTIME OBSERVATION &amp; CORRELATION</text>

  <rect x="82" y="642" width="202" height="72" rx="16" class="node soft-blue"/>
  <text x="183" y="671" text-anchor="middle" class="label" font-size="15" font-weight="600">Intent ledger</text>
  <text x="183" y="692" text-anchor="middle" class="label muted" font-size="12">authorized action record</text>

  <rect x="326" y="642" width="202" height="72" rx="16" class="node soft-purple"/>
  <text x="427" y="671" text-anchor="middle" class="label" font-size="15" font-weight="600">Linux runtime</text>
  <text x="427" y="692" text-anchor="middle" class="label muted" font-size="12">actual tool behavior</text>

  <rect x="570" y="642" width="202" height="72" rx="16" class="node soft-teal"/>
  <text x="671" y="671" text-anchor="middle" class="label" font-size="15" font-weight="600">Tetragon eBPF</text>
  <text x="671" y="692" text-anchor="middle" class="label muted" font-size="12">process · file · network</text>

  <rect x="814" y="642" width="202" height="72" rx="16" class="node soft-teal"/>
  <text x="915" y="671" text-anchor="middle" class="label" font-size="15" font-weight="600">Signed adapter</text>
  <text x="915" y="692" text-anchor="middle" class="label muted" font-size="12">authenticated JSON events</text>

  <rect x="1058" y="642" width="202" height="72" rx="16" class="node soft-teal"/>
  <text x="1159" y="671" text-anchor="middle" class="label" font-size="15" font-weight="600">Runtime observations</text>
  <text x="1159" y="692" text-anchor="middle" class="label muted" font-size="12">normalized evidence</text>

  <rect x="1302" y="642" width="202" height="72" rx="16" fill="url(#tealGradient)" filter="url(#shadow)"/>
  <text x="1403" y="671" text-anchor="middle" class="label white" font-size="15" font-weight="600">Intent correlator</text>
  <text x="1403" y="692" text-anchor="middle" class="label white" font-size="12" opacity="0.82">intent vs. observation</text>

  <rect x="1546" y="642" width="170" height="72" rx="16" class="node soft-red"/>
  <text x="1631" y="671" text-anchor="middle" class="label" font-size="15" font-weight="600">OCSF finding</text>
  <text x="1631" y="692" text-anchor="middle" class="label muted" font-size="12">severity + mapping</text>

  <rect x="326" y="752" width="202" height="62" rx="15" class="node"/>
  <text x="427" y="778" text-anchor="middle" class="label" font-size="14" font-weight="600">K8s Pod inventory</text>
  <text x="427" y="797" text-anchor="middle" class="label muted" font-size="11">UID · namespace · SA</text>

  <rect x="570" y="752" width="202" height="62" rx="15" class="node"/>
  <text x="671" y="778" text-anchor="middle" class="label" font-size="14" font-weight="600">Identity resolver</text>
  <text x="671" y="797" text-anchor="middle" class="label muted" font-size="11">workload binding</text>

  <rect x="814" y="752" width="202" height="62" rx="15" class="node"/>
  <text x="915" y="778" text-anchor="middle" class="label" font-size="14" font-weight="600">K8s Audit Log</text>
  <text x="915" y="797" text-anchor="middle" class="label muted" font-size="11">API identity + RBAC</text>

  <rect x="1058" y="752" width="202" height="62" rx="15" class="node"/>
  <text x="1159" y="778" text-anchor="middle" class="label" font-size="14" font-weight="600">Attack-chain correlator</text>
  <text x="1159" y="797" text-anchor="middle" class="label muted" font-size="11">RBAC → Pod → exec</text>

  <!-- RUNTIME EDGES -->
  <path d="M1639 396 V526 Q1639 550 1615 550 H451 Q427 550 427 642" class="flow-blue"/>
  <text x="1030" y="540" text-anchor="middle" class="label muted" font-size="11">approved tool execution</text>
