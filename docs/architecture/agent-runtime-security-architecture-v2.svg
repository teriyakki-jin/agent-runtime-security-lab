  <rect x="76" y="158" width="286" height="34" rx="17" fill="url(#blueGradient)"/>
  <text x="99" y="181" class="label white" font-size="14" font-weight="600">01 · PRE-EXECUTION CONTROL</text>

  <text x="92" y="224" class="label muted" font-size="12" font-weight="600" letter-spacing="1.2">INPUTS</text>
  <rect x="82" y="242" width="216" height="66" rx="15" class="node soft-blue"/>
  <circle cx="112" cy="275" r="17" fill="#3569e8"/>
  <text x="112" y="280" text-anchor="middle" class="label white" font-size="13" font-weight="600">A</text>
  <text x="140" y="270" class="label" font-size="15" font-weight="600">Attack scenarios</text>
  <text x="140" y="290" class="label muted" font-size="12">trusted + adversarial tests</text>

  <rect x="82" y="330" width="216" height="66" rx="15" class="node soft-purple"/>
  <circle cx="112" cy="363" r="17" fill="#7c52e7"/>
  <text x="112" y="368" text-anchor="middle" class="label white" font-size="13" font-weight="600">D</text>
  <text x="140" y="358" class="label" font-size="15" font-weight="600">External document</text>
  <text x="140" y="378" class="label muted" font-size="12">untrusted content</text>

  <rect x="338" y="330" width="192" height="66" rx="15" class="node soft-purple"/>
  <text x="434" y="357" text-anchor="middle" class="label" font-size="15" font-weight="600">Local Qwen3</text>
  <text x="434" y="378" text-anchor="middle" class="label muted" font-size="12">llama.cpp inference</text>

  <rect x="570" y="330" width="206" height="66" rx="15" class="node soft-red"/>
  <text x="673" y="357" text-anchor="middle" class="label" font-size="15" font-weight="600">Provenance guard</text>
  <text x="673" y="378" text-anchor="middle" class="label muted" font-size="12">taint + injection scoring</text>

  <rect x="352" y="225" width="304" height="82" rx="18" fill="url(#blueGradient)" filter="url(#shadow)"/>
  <text x="504" y="258" text-anchor="middle" class="label white" font-size="19" font-weight="600">Agent Gateway</text>
  <text x="504" y="282" text-anchor="middle" class="label white" font-size="12" opacity="0.82">policy boundary · intent recording · tool dispatch</text>

  <text x="728" y="224" class="label muted" font-size="12" font-weight="600" letter-spacing="1.2">POLICY &amp; CONSENT</text>
  <rect x="714" y="242" width="214" height="66" rx="15" class="node soft-blue"/>
  <text x="821" y="270" text-anchor="middle" class="label" font-size="15" font-weight="600">OPA policy engine</text>
  <text x="821" y="290" text-anchor="middle" class="label muted" font-size="12">allow · review · deny</text>
  <rect x="800" y="330" width="170" height="66" rx="15" class="node"/>
  <text x="885" y="358" text-anchor="middle" class="label" font-size="15" font-weight="600">Human reviewer</text>
  <text x="885" y="378" text-anchor="middle" class="label muted" font-size="12">one-time capability</text>

  <text x="1012" y="224" class="label muted" font-size="12" font-weight="600" letter-spacing="1.2">IDENTITY &amp; ARTIFACT TRUST</text>
  <rect x="992" y="242" width="220" height="66" rx="15" class="node soft-teal"/>
  <text x="1102" y="270" text-anchor="middle" class="label" font-size="15" font-weight="600">OAuth server</text>
  <text x="1102" y="290" text-anchor="middle" class="label muted" font-size="12">RS256 · audience · scopes</text>

  <rect x="992" y="330" width="220" height="66" rx="15" class="node soft-orange"/>
  <text x="1102" y="358" text-anchor="middle" class="label" font-size="15" font-weight="600">Trusted tool manifest</text>
  <text x="1102" y="378" text-anchor="middle" class="label muted" font-size="12">canonical tools + scopes</text>

  <rect x="1252" y="330" width="208" height="66" rx="15" class="node soft-orange"/>
  <text x="1356" y="358" text-anchor="middle" class="label" font-size="15" font-weight="600">OCI registry</text>
  <text x="1356" y="378" text-anchor="middle" class="label muted" font-size="12">signed image + SBOM</text>

  <rect x="1252" y="225" width="276" height="82" rx="18" fill="url(#orangeGradient)" filter="url(#shadow)"/>
  <text x="1390" y="258" text-anchor="middle" class="label white" font-size="18" font-weight="600">Supply-chain trust gate</text>
  <text x="1390" y="282" text-anchor="middle" class="label white" font-size="12" opacity="0.84">Cosign · digest · SBOM · manifest</text>

  <rect x="1562" y="225" width="154" height="171" rx="20" fill="url(#purpleGradient)" filter="url(#shadow)"/>
  <circle cx="1639" cy="267" r="22" fill="#ffffff" opacity="0.18"/>
  <text x="1639" y="274" text-anchor="middle" class="label white" font-size="18" font-weight="600">MCP</text>
  <text x="1639" y="316" text-anchor="middle" class="label white" font-size="18" font-weight="600">Tool Server</text>
  <text x="1639" y="341" text-anchor="middle" class="label white" font-size="12" opacity="0.82">approved digest</text>
  <text x="1639" y="360" text-anchor="middle" class="label white" font-size="12" opacity="0.82">scoped token</text>

