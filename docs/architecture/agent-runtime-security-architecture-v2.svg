  <path d="M298 275 H330 Q352 275 352 266" class="flow-blue"/>
  <path d="M298 363 H338" class="flow"/>
  <path d="M530 363 H570" class="flow"/>
  <path d="M673 330 V310 Q673 266 656 266" class="flow-blue"/>
  <path d="M656 246 H714" class="flow-blue"/>
  <path d="M714 294 H656" class="flow thin"/>
  <path d="M885 330 V318 H690 Q674 318 674 300 H656" class="flow"/>
  <path d="M656 225 V198 H970 V275 H992" class="flow-blue"/>
  <path d="M1102 308 V420 H1600 Q1639 420 1639 396" class="flow-blue"/>
  <path d="M1212 363 H1236 Q1252 363 1252 299" class="flow"/>
