<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Agent Runtime Security Platform Architecture</title>
  <desc id="desc">Layered architecture covering pre-execution trust controls, runtime observation and correlation, and post-execution detection and incident response.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10213a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="headerGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#203b69"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#2357d9"/>
      <stop offset="1" stop-color="#4d7cff"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#6b46d9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#087f8c"/>
      <stop offset="1" stop-color="#16a3a8"/>
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#c75b12"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#51627a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3569e8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db3a4a"/>
    </marker>
    <style>
      .label { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #14213d; }
      .muted { fill: #64748b; }
      .white { fill: #ffffff; }
      .band { fill: #ffffff; stroke: #d9e1ec; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .soft-blue { fill: #eef4ff; stroke: #9bb8ff; }
      .soft-purple { fill: #f4efff; stroke: #bea8f7; }
      .soft-teal { fill: #e9f8f8; stroke: #8bd4d5; }
      .soft-orange { fill: #fff4e8; stroke: #f4bd82; }
      .soft-red { fill: #fff0f1; stroke: #f2a1aa; }
      .flow { fill: none; stroke: #51627a; stroke-width: 3; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #3569e8; stroke-width: 3.5; marker-end: url(#arrowBlue); }
      .telemetry { fill: none; stroke: #087f8c; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .deny { fill: none; stroke: #db3a4a; stroke-width: 3; stroke-dasharray: 7 6; marker-end: url(#arrowRed); }
      .thin { stroke-width: 2.25; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="#f4f7fb"/>

  <rect x="52" y="40" width="1696" height="74" rx="22" fill="url(#headerGradient)" filter="url(#shadow)"/>
  <text x="88" y="75" class="label white" font-size="27" font-weight="600">AGENT RUNTIME SECURITY PLATFORM</text>
  <text x="88" y="99" class="label white" font-size="14" opacity="0.76">Pre-execution trust · Runtime enforcement · Detection, response and evidence</text>
  <g transform="translate(1260 64)">
    <line x1="0" y1="0" x2="44" y2="0" class="flow-blue thin"/>
    <text x="56" y="5" class="label white" font-size="12">control / execution</text>
    <line x1="202" y1="0" x2="246" y2="0" class="telemetry thin"/>
    <text x="258" y="5" class="label white" font-size="12">telemetry</text>
    <line x1="362" y1="0" x2="406" y2="0" class="deny thin"/>
    <text x="418" y="5" class="label white" font-size="12">deny / finding</text>
  </g>

  <!-- PRE-EXECUTION -->
