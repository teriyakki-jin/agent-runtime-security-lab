name: agent-runtime-security-lab

services:
  opa:
    image: openpolicyagent/opa:1.17.0-static
    container_name: arsl-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policy:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - agent_net
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    container_name: arsl-jaeger
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - agent_net
    restart: unless-stopped

  auth-server:
    build:
      context: ./auth-server
    container_name: arsl-auth-server
    environment:
      OAUTH_ISSUER: http://auth-server:9000
      MCP_RESOURCE: http://mcp-server:8000/mcp
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:19000:9000"
    networks:
      - agent_net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
    container_name: arsl-mcp-server
    environment:
      APPROVAL_HMAC_KEY: ${APPROVAL_HMAC_KEY:-}
      OAUTH_ISSUER: http://auth-server:9000
      OAUTH_JWKS_URL: http://auth-server:9000/jwks.json
      MCP_RESOURCE: http://mcp-server:8000/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: mcp-tool-server
    expose:
      - "8000"
    networks:
      - agent_net
    depends_on:
      - auth-server
      - jaeger
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  agent-api:
    build:
      context: ./agent-api
    container_name: arsl-agent-api
    environment:
      APPROVAL_HMAC_KEY: ${APPROVAL_HMAC_KEY:-}
      RUNTIME_SENSOR_HMAC_KEY: ${RUNTIME_SENSOR_HMAC_KEY:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_TOKEN_URL: http://auth-server:9000/token
      MCP_RESOURCE: http://mcp-server:8000/mcp
      APPROVAL_TTL_SECONDS: 300
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      OPA_DECISION_URL: http://opa:8181/v1/data/agent_security/decision
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: agent-gateway
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - agent_net
    depends_on:
      - auth-server
      - jaeger
      - mcp-server
      - opa
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: arsl-elasticsearch
    profiles: ["soc"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ARSL_ELASTICSEARCH_PORT:-19200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - agent_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.2
    container_name: arsl-logstash
    profiles: ["soc"]
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "127.0.0.1:${ARSL_LOGSTASH_PORT:-19600}:9600"
    volumes:
      - ./deploy/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - agent_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: arsl-kibana
    profiles: ["soc"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      XPACK_SECURITY_SHOWINSECURECLUSTERWARNING: "false"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "127.0.0.1:${ARSL_KIBANA_PORT:-15601}:5601"
    networks:
      - agent_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  agent_net:
    driver: bridge

volumes:
  elasticsearch-data:
