name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile soc config --quiet
          docker compose --profile llm config --quiet
          docker compose --profile supply-chain config --quiet

      - name: Compile Python sources
        run: |
          python -m compileall -q agent-api/app
          python -m compileall -q agent-api/tests
          python -m compileall -q mcp-server/app
          python -m compileall -q mcp-server/tests
          python -m compileall -q auth-server/app
          python -m compileall -q auth-server/tests
          python -m compileall -q sensor
          python -m compileall -q detection
          python -m compileall -q kubernetes
          python -m compileall -q supply_chain

      - name: Test Tetragon event adapter
        run: |
          python -m unittest discover -s sensor/tests -v
          python -m unittest discover -s detection/tests -v
          python -m unittest discover -s kubernetes/tests -v
          python -m unittest discover -s supply_chain/tests -v
          python -m json.tool docs/evidence/phase4-tetragon-validation.json > /dev/null
          python -m json.tool docs/evidence/phase5-soc-validation.json > /dev/null
          python -m json.tool docs/evidence/phase6-threat-detection.json > /dev/null
          python -m json.tool docs/evidence/phase7-kubernetes-identity.json > /dev/null
          python -m json.tool docs/evidence/phase8-kubernetes-audit-chain.json > /dev/null
          python -m json.tool docs/evidence/phase9-mcp-oauth.json > /dev/null
          python -m json.tool docs/evidence/phase10-local-llm-injection.json > /dev/null
          python -m json.tool docs/evidence/phase11-native-alerting.json > /dev/null
          python -m json.tool docs/evidence/phase12-mcp-supply-chain.json > /dev/null
          python -m json.tool deploy/elasticsearch/arsl-ocsf-template.json > /dev/null
          python -m json.tool deploy/elasticsearch/arsl-alerts-template.json > /dev/null
          python -m json.tool deploy/elasticsearch/arsl-notifications-template.json > /dev/null
          python -m json.tool deploy/elasticsearch/arsl-supply-chain-template.json > /dev/null
          python -m json.tool deploy/supply-chain/trusted-mcp-tools.json > /dev/null
          python -m json.tool deploy/elastic/detection-rules/agent-runtime-rules.json > /dev/null
          python -m json.tool deploy/elastic/connectors/slack.example.json > /dev/null
          python -m json.tool deploy/elastic/connectors/teams.example.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          lines = Path("deploy/kibana/arsl-soc-dashboard.ndjson").read_text().splitlines()
          assert len(lines) == 6
          objects = [json.loads(line) for line in lines]
          assert any(item.get("id") == "arsl-soc-overview" for item in objects)
          threat_lines = Path("deploy/kibana/arsl-threat-dashboard.ndjson").read_text().splitlines()
          assert len(threat_lines) == 6
          threat_objects = [json.loads(line) for line in threat_lines]
          assert any(item.get("id") == "arsl-threat-mapping" for item in threat_objects)
          incident_lines = Path("deploy/kibana/arsl-incident-response-dashboard.ndjson").read_text().splitlines()
          assert len(incident_lines) == 5
          incident_objects = [json.loads(line) for line in incident_lines]
          assert any(item.get("id") == "arsl-phase11-incident-response" for item in incident_objects)
          supply_chain_lines = Path("deploy/kibana/arsl-supply-chain-dashboard.ndjson").read_text().splitlines()
          assert len(supply_chain_lines) == 5
          supply_chain_objects = [json.loads(line) for line in supply_chain_lines]
          assert any(item.get("id") == "arsl-phase12-supply-chain" for item in supply_chain_objects)
          workloads = Path("deploy/kubernetes/phase7-workloads.yaml").read_text()
          for control in (
              "runAsNonRoot: true",
              "allowPrivilegeEscalation: false",
              'drop: ["ALL"]',
              "automountServiceAccountToken: false",
              "seccompProfile:",
          ):
              assert control in workloads
          audit_cluster = Path("deploy/kind/phase8-cluster.yaml").read_text()
          audit_policy = Path("deploy/kubernetes/phase8-audit-policy.yaml").read_text()
          attack_pod = Path("deploy/kubernetes/phase8-shadow-pod.yaml").read_text()
          rbac_lab = Path("deploy/kubernetes/phase8-rbac-bootstrap.yaml").read_text()
          assert "audit-log-path:" in audit_cluster
          assert "audit-policy-file:" in audit_cluster
          assert 'resources: ["rolebindings", "clusterrolebindings"]' in audit_policy
          assert 'resources: ["pods", "pods/exec"]' in audit_policy
          assert 'resourceNames: ["cluster-admin"]' in rbac_lab
          assert 'verbs: ["bind"]' in rbac_lab
          for control in (
              "runAsNonRoot: true",
              "allowPrivilegeEscalation: false",
              'drop: ["ALL"]',
              "automountServiceAccountToken: false",
              "seccompProfile:",
          ):
              assert control in attack_pod
          phase8 = json.loads(Path("docs/evidence/phase8-kubernetes-audit-chain.json").read_text())
          assert phase8["finding"]["mitre_attack"] == ["T1098.006", "T1610"]
          assert not any(phase8["privacy"].values())
          phase9 = json.loads(Path("docs/evidence/phase9-mcp-oauth.json").read_text(encoding="utf-8-sig"))
          assert phase9["result"] == "passed"
          assert phase9["token_exported"] is False
          assert all(phase9["checks"].values())
          assert phase9["finding"]["threat"]["mitre_attacks"][0]["technique"]["uid"] == "T1550.001"
          oauth_server = Path("auth-server/app/main.py").read_text()
          mcp_oauth = Path("mcp-server/app/oauth.py").read_text()
          assert 'code_challenge_method != "S256"' in oauth_server
          assert 'audience=MCP_RESOURCE' in mcp_oauth
          assert 'algorithms=["RS256"]' in mcp_oauth
          phase10 = json.loads(Path("docs/evidence/phase10-local-llm-injection.json").read_text())
          assert phase10["result"] == "passed"
          assert all(phase10["checks"].values())
          assert phase10["model"]["runtime"] == "llama.cpp"
          assert len(phase10["model"]["sha256"]) == 64
          assert phase10["inference"]["raw_prompt_exported"] is False
          assert phase10["inference"]["raw_model_response_exported"] is False
          assert phase10["finding"]["owasp_agentic"] == ["ASI01"]
          assert phase10["finding"]["mitre_atlas"] == ["AML.T0051"]
          assert all(not decision["executed"] for decision in phase10["tool_decisions"])
          guard = Path("agent-api/app/prompt_guard.py").read_text()
          assert 'normalize("NFKC"' in guard
          assert Path("agent-api/fixtures/untrusted/quarterly-report.txt").is_file()
          phase11 = json.loads(Path("docs/evidence/phase11-native-alerting.json").read_text())
          assert phase11["result"] == "passed"
          assert all(phase11["checks"].values())
          assert len(phase11["rules"]) == 3
          assert all(rule["type"] == "esql" and rule["enabled"] for rule in phase11["rules"])
          assert phase11["connector"]["type"] == ".index"
          assert phase11["connector"]["minimum_license"] == "basic"
          assert phase11["delivery"]["native_alerts_created"] == 3
          assert phase11["delivery"]["notifications_created"] == 3
          assert not any(phase11["privacy"].values())
          assert phase11["external_channels"]["slack"]["configured"] is False
          assert phase11["external_channels"]["teams"]["configured"] is False
          slack = json.loads(Path("deploy/elastic/connectors/slack.example.json").read_text())
          teams = json.loads(Path("deploy/elastic/connectors/teams.example.json").read_text())
          assert slack["secrets"]["webhookUrl"] == "${SLACK_WEBHOOK_URL}"
          assert teams["secrets"]["webhookUrl"] == "${TEAMS_WEBHOOK_URL}"
          notification_template = json.loads(Path("deploy/elasticsearch/arsl-notifications-template.json").read_text())
          assert notification_template["template"]["mappings"]["dynamic"] == "strict"
          assert notification_template["template"]["settings"]["index.lifecycle.name"] == "arsl-ocsf-7d"
          phase12 = json.loads(Path("docs/evidence/phase12-mcp-supply-chain.json").read_text())
          assert phase12["result"] == "passed"
          assert all(phase12["checks"].values())
          assert len(phase12["attack_replay"]) == 3
          assert all(item["decision"] == "deny" and item["executed"] is False for item in phase12["attack_replay"])
          assert phase12["trusted_artifact"]["sbom"]["format"] == "CycloneDX JSON"
          assert phase12["trusted_artifact"]["sbom"]["component_count"] > 0
          assert not any(phase12["privacy"].values())
          manifest = json.loads(Path("deploy/supply-chain/trusted-mcp-tools.json").read_text())
          assert manifest["policy"]["require_signature"] is True
          assert manifest["policy"]["require_sbom_attestation"] is True
          assert manifest["policy"]["deny_unlisted_tools"] is True
          assert len(manifest["tools"]) == manifest["policy"]["maximum_tools"] == 3
          supply_chain_template = json.loads(Path("deploy/elasticsearch/arsl-supply-chain-template.json").read_text())
          assert supply_chain_template["template"]["mappings"]["dynamic"] == "strict"
          assert supply_chain_template["template"]["settings"]["index.lifecycle.name"] == "arsl-ocsf-7d"
          PY

      - name: Validate OPA policies
        run: |
          docker run --rm \
            -v "$PWD/policy:/policies:ro" \
            openpolicyagent/opa:1.17.0-static \
            test /policies -v

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parseErrors = @()
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw 'PowerShell syntax validation failed.'
          }

      - name: Run container integration scenarios
        shell: pwsh
        run: ./scripts/run-lab.ps1

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop integration lab
        if: always()
        run: docker compose down --volumes
