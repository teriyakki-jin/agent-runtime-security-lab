input {
  http_poller {
    id => "arsl_api_activity"
    urls => {
      api_activity => {
        method => get
        url => "http://agent-api:8080/api/events/ocsf"
        headers => { Accept => "application/json" }
      }
    }
    request_timeout => 10
    schedule => { every => "5s" }
    codec => json
    ecs_compatibility => "v8"
    metadata_target => "[@metadata][http_poller]"
    add_field => { "[@metadata][arsl_stream]" => "api_activity" }
  }

  http_poller {
    id => "arsl_detection_finding"
    urls => {
      detection_finding => {
        method => get
        url => "http://agent-api:8080/api/runtime/ocsf"
        headers => { Accept => "application/json" }
      }
    }
    request_timeout => 10
    schedule => { every => "5s" }
    codec => json
    ecs_compatibility => "v8"
    metadata_target => "[@metadata][http_poller]"
    add_field => { "[@metadata][arsl_stream]" => "detection_finding" }
  }
}

filter {
  if ![metadata][uid] {
    drop { }
  }

  date {
    match => ["time", "UNIX_MS"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "[lab][name]" => "agent-runtime-security-lab"
      "[lab][phase]" => "5"
      "[lab][stream]" => "%{[@metadata][arsl_stream]}"
    }
  }
}

output {
  elasticsearch {
    id => "arsl_ocsf_elasticsearch"
    hosts => ["http://elasticsearch:9200"]
    index => "arsl-ocsf-%{+YYYY.MM.dd}"
    document_id => "%{[metadata][uid]}"
    action => "index"
  }
}
