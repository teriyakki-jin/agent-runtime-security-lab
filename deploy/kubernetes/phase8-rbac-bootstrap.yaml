apiVersion: v1
kind: Namespace
metadata:
  name: arsl-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compromised-agent
  namespace: arsl-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phase8-rolebinding-writer
  namespace: arsl-lab
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phase8-rolebinding-writer
  namespace: arsl-lab
subjects:
  - kind: ServiceAccount
    name: compromised-agent
    namespace: arsl-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phase8-rolebinding-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phase8-cluster-admin-binder
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["cluster-admin"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phase8-cluster-admin-binder
subjects:
  - kind: ServiceAccount
    name: compromised-agent
    namespace: arsl-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: phase8-cluster-admin-binder
